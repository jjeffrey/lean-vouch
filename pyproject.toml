[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-vouch"
dynamic = ["version"]
description = "Review tools for Lean definitions and statements, in doc-gen4 pages"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jonathan Jeffrey" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["lean", "lean4", "formal verification", "code review", "doc-gen4"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/jjeffrey/lean-vouch"
Issues = "https://github.com/jjeffrey/lean-vouch/issues"
Changelog = "https://github.com/jjeffrey/lean-vouch/blob/main/CHANGELOG.md"

[project.scripts]
lean-vouch = "lean_vouch.cli:main"

[tool.setuptools]
packages = ["lean_vouch", "lean_vouch.graph", "lean_vouch.web"]

[tool.setuptools.dynamic]
version = { attr = "lean_vouch.server.VERSION" }

[tool.setuptools.package-data]
"lean_vouch.graph" = ["*.lean"]
"lean_vouch.web" = ["*"]
